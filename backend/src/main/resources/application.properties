server.port=8080

# Application Details
spring.application.name=smart-queue-backend

# Default Database: Embedded H2 running in MySQL 8 compatibility mode
# This guarantees 100% out-of-the-box instant execution without manual DB provisioning
spring.datasource.url=jdbc:h2:mem:smart_queue_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
jwt.secret=SmartQueueSuperSecretKeyForJWTTokenGeneration2026Secure1234567890
jwt.expiration-ms=86400000

# Logging
logging.level.com.smartqueue=INFO
logging.level.org.springframework.security=INFO
