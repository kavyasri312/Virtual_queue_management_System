# Native MySQL 8 Configuration Profile
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or: java -jar target/smart-queue-backend-1.0.0.jar --spring.profiles.active=mysql

spring.datasource.url=jdbc:mysql://localhost:3306/smart_queue_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false
